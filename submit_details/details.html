<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Enter your details on FarmLancer by MHTECHIN Technologies to manage your agricultural tasks efficiently.">
    <meta name="keywords" content="FarmLancer, MHTECHIN, agriculture, details, farming, mobile app">
    <meta name="author" content="MHTECHIN Technologies">
    <title>FarmLancer Enter Details</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="details-container">
        <h1>FarmLancer</h1>
        <p>by MHTECHIN Technologies</p>
        <form id="details-form">
            <input type="text" id="name" placeholder="Enter your name" required>
            <input type="tel" id="mobile" placeholder="Enter your mobile no." required>
            <input type="text" id="experience" placeholder="Work Experience" required>
            <input type="text" id="budget" placeholder="Budget Expectation" required>
            <input type="text" id="availability" placeholder="Availability for work" required>
            <button type="submit">Submit Details</button>
        </form>
    </div>
    <script src="script.js"></script>
</body>
</html>
