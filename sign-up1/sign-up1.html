<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Sign up for FarmLancer by MHTECHIN Technologies to manage your agricultural tasks efficiently.">
    <meta name="keywords" content="FarmLancer, MHTECHIN, agriculture, sign up, farming, mobile app">
    <meta name="author" content="MHTECHIN Technologies">
    <title>FarmLancer Sign Up</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="signup-container">
        <h1>FarmLancer</h1>
        <p>by MHTECHIN Technologies</p>
        <h3>Create new account</h3>
        <form id="signup-form">
            <input type="email" id="email" placeholder="Enter your email address" required>
            <input type="tel" id="mobile" placeholder="+62xxxxxxxxxxx" required>
            <button type="submit" >Next</button>
        </form>
        <div class="other-options">
            <p>Other way to sign up</p>
            <p>Already have an account? <a href="/sign-in/signin.html">Back to Sign In</a></p>
        </div>
    </div>
    <script src="sign-up1.js"></script>
</body>
</html>
