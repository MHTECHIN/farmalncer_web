<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Enable access to data to receive updates and reminders.">
    <meta name="keywords" content="data access, notifications, user permissions">
    <meta name="robots" content="index, follow">
    <title>Access of Data</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }
        body {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: #f9f9f9;
        }
        .container {
            width: 90%;
            max-width: 400px;
            background: linear-gradient(to bottom, #7dfc86, #ffffff);
            padding: 20px;
            border-radius: 15px;
            text-align: center;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }
        img {
            width: 100px;
            margin-bottom: 15px;
        }
        h2 {
            font-size: 20px;
            font-weight: bold;
            color: #1d1d1d;
        }
        p {
            color: #555;
            margin: 10px 0;
        }
        .button {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 25px;
            font-size: 16px;
            cursor: pointer;
            margin-top: 10px;
        }
        .allow {
            background: #4CAF50;
            color: white;
        }
        .skip {
            background: white;
            border: 1px solid #4CAF50;
            color: #4CAF50;
        }
    </style>
</head>
<body>
    <div class="container">
        <img src="prod_cat_specialx.png" alt="Access Icon">
        <h2>Access of Data</h2>
        <p>Please enable access to data to receive updates and reminders.</p>
        <button class="button allow" onclick="grantAccess()">Allow</button>
        <button class="button skip" onclick="skipAccess()">Skip for now</button>
    </div>

    <script>
        function grantAccess() {
            alert("Data access granted!");
        }
        function skipAccess() {
            alert("You skipped data access!");
        }
    </script>
</body>
</html>
