<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="User profile settings, privacy policy, and support options.">
    <meta name="keywords" content="profile, settings, support, user account, privacy policy">
    <meta name="robots" content="index, follow">
    <title>Profile Menu</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="profile-container">
        <h2>My Profile</h2>
        <div class="profile-header">
            <div class="profile-pic"></div>
            <div class="profile-info">
                <strong>Rameshwar Mhaske</strong>
                <p>rameshwar@mhtechin.com</p>
                <p>08xxxxxxxx</p>
            </div>
            <span class="arrow">&#9654;</span>
        </div>
        <div class="settings">
            <h3>Settings</h3>
            <ul>
                <li>Privacy Policy <span>&#9654;</span></li>
                <li>Cancellation Policy <span>&#9654;</span></li>
                <li>Disclaimer <span>&#9654;</span></li>
            </ul>
        </div>
        <div class="support">
            <h3>Support</h3>
            <ul>
                <li>Terms & Conditions <span>&#9654;</span></li>
                <li>Contact Us <span>&#9654;</span></li>
                <li>About Us <span>&#9654;</span></li>
                <li>Job Posting Account <span>&#9654;</span></li>
            </ul>
        </div>
        <div class="actions">
            <button class="get-job">Get a Job</button>
            <button class="post-job">Post a Job</button>
        </div>
    </div>
    <footer class="footer">
        <nav>
            <a href="#" class="active"><img src="home-icon.png" alt="Home"></a>
            <a href="#"><img src="cloud-icon.png" alt="Weather"></a>
            <a href="#"><img src="star-icon.png" alt="Featured"></a>
            <a href="#"><img src="plant-icon.png" alt="Agriculture"></a>
            <a href="#"><img src="user-icon.png" alt="Profile"></a>
        </nav>
    </footer>
    <script src="script.js"></script>
</body>
</html>
